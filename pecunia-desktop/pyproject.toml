# =============================================================================
# Pecunia Desktop - Project Configuration
# =============================================================================
#
# This file contains all project metadata, dependencies, and build configuration
# for the Pecunia Desktop application (Python/PyQt6).
#
# References:
# - PEP 517/518: https://peps.python.org/pep-0517/
# - PEP 621: https://peps.python.org/pep-0621/
# - PyInstaller Hooks: https://pyinstaller.org/en/stable/hooks.html
#
# =============================================================================

# -----------------------------------------------------------------------------
# Build System Configuration
# -----------------------------------------------------------------------------

[build-system]
requires = [
    "setuptools>=68.0",
    "wheel>=0.41",
    "setuptools-scm>=8.0",
]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project Metadata (PEP 621)
# -----------------------------------------------------------------------------

[project]
name = "pecunia-desktop"
version = "1.0.0"
description = "Personal Finance Management Desktop Application"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
keywords = [
    "finance",
    "personal-finance",
    "budget",
    "money-management",
    "accounting",
    "desktop",
    "pyqt6",
]

authors = [
    { name = "Pecunia Team", email = "dev@pecunia.com" }
]

maintainers = [
    { name = "Pecunia Team", email = "support@pecunia.com" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Typing :: Typed",
]

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------

dependencies = [
    # GUI Framework
    "PyQt6>=6.6.0",
    "PyQt6-Charts>=6.6.0",
    "pyqtgraph>=0.13.3",
    "qasync>=0.27.0",

    # HTTP/API Client
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",

    # Database
    "SQLAlchemy>=2.0.25",
    "aiosqlite>=0.19.0",

    # Security
    "keyring>=24.3.0",
    "cryptography>=42.0.0",

    # Data Processing
    "pandas>=2.1.0",
    "python-dateutil>=2.8.2",

    # Configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Export/Reports
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",

    # Notifications
    "plyer>=2.1.0",
]

# Optional dependencies for different use cases
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.3.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "pre-commit>=3.6.0",
]

build = [
    "pyinstaller>=6.3.0",
    "pyinstaller-hooks-contrib>=2024.0",
]

docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
]

all = [
    "pecunia-desktop[dev,build,docs]",
]

# -----------------------------------------------------------------------------
# Entry Points
# -----------------------------------------------------------------------------

[project.scripts]
pecunia = "main:main"
pecunia-cli = "cli:main"

[project.gui-scripts]
pecunia-gui = "main:main"

# -----------------------------------------------------------------------------
# Project URLs
# -----------------------------------------------------------------------------

[project.urls]
Homepage = "https://pecunia.com"
Documentation = "https://docs.pecunia.com"
Repository = "https://github.com/pecunia/pecunia-desktop"
Changelog = "https://github.com/pecunia/pecunia-desktop/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/pecunia/pecunia-desktop/issues"

# -----------------------------------------------------------------------------
# Setuptools Configuration
# -----------------------------------------------------------------------------

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"*" = [
    "*.json",
    "*.qss",
    "*.png",
    "*.ico",
    "*.icns",
    "*.svg",
]

# -----------------------------------------------------------------------------
# Setuptools SCM (Version from Git)
# -----------------------------------------------------------------------------

[tool.setuptools_scm]
write_to = "src/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

# -----------------------------------------------------------------------------
# Black (Code Formatter)
# -----------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

# -----------------------------------------------------------------------------
# isort (Import Sorting)
# -----------------------------------------------------------------------------

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["venv/*", ".venv/*", "build/*", "dist/*"]
known_first_party = ["src", "pecunia"]
known_third_party = [
    "PyQt6",
    "aiohttp",
    "httpx",
    "sqlalchemy",
    "pandas",
    "pydantic",
]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

# -----------------------------------------------------------------------------
# Ruff (Fast Linter)
# -----------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ARG001", # unused function argument
]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__
"tests/*" = ["ARG"]       # unused arguments in tests

# -----------------------------------------------------------------------------
# MyPy (Type Checking)
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "aiohttp.*",
    "pandas.*",
    "reportlab.*",
    "openpyxl.*",
    "keyring.*",
    "plyer.*",
    "qasync.*",
]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# Pytest Configuration
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-p", "no:warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gui: marks tests that require GUI",
    "network: marks tests that require network access",
]
asyncio_mode = "auto"
qt_api = "pyqt6"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# -----------------------------------------------------------------------------
# Coverage Configuration
# -----------------------------------------------------------------------------

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

# -----------------------------------------------------------------------------
# PyInstaller Configuration
# -----------------------------------------------------------------------------

# Note: PyInstaller doesn't read pyproject.toml directly, but these settings
# are used by our build scripts (scripts/build_*.py)

[tool.pyinstaller]
name = "Pecunia"
onefile = true
windowed = true
console = false
strip = true
upx = false

# Hidden imports that PyInstaller might miss
hidden_imports = [
    "PyQt6.QtCore",
    "PyQt6.QtGui",
    "PyQt6.QtWidgets",
    "PyQt6.QtCharts",
    "PyQt6.sip",
    "aiosqlite",
    "sqlalchemy.dialects.sqlite",
    "keyring.backends.Windows",
    "keyring.backends.macOS",
    "keyring.backends.SecretService",
    "cryptography.fernet",
    "pandas._libs.tslibs.timedeltas",
    "pydantic",
    "pydantic_settings",
]

# Modules to exclude
excludes = [
    "tkinter",
    "matplotlib",
    "scipy",
    "PIL",
    "cv2",
    "tensorflow",
    "torch",
    "pytest",
    "unittest",
]

# Data files to include
datas = [
    ["resources/icons", "resources/icons"],
    ["resources/styles", "resources/styles"],
    ["src/i18n/translations", "i18n/translations"],
]

# -----------------------------------------------------------------------------
# Custom Tool Configurations
# -----------------------------------------------------------------------------

[tool.pecunia]
# Application settings used by build scripts
app_name = "Pecunia"
app_display_name = "Pecunia Desktop"
bundle_id = "com.pecunia.desktop"
organization = "Pecunia Inc."
website = "https://pecunia.com"
support_email = "support@pecunia.com"

# Supported platforms
platforms = ["windows", "macos", "linux"]

# Minimum OS versions
min_windows_version = "10.0"
min_macos_version = "10.15"
min_linux_kernel = "4.0"

# Update server configuration
update_url = "https://updates.pecunia.com"
update_channel = "stable"  # stable, beta, alpha
