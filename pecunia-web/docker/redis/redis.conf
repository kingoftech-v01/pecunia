# =============================================================================
# Redis Configuration for pecunia-web
# Optimized for Celery message broker and result backend
# =============================================================================

# -----------------------------------------------------------------------------
# NETWORK
# -----------------------------------------------------------------------------

# SECURITY: In production, restrict to 127.0.0.1 or specific Docker network IPs.
# Using 0.0.0.0 here for Docker inter-container communication; ensure network
# policies or firewall rules prevent external access in production.
bind 127.0.0.1

# Default Redis port
port 6379

# TCP listen backlog
tcp-backlog 511

# Close connection after client is idle for N seconds (0 to disable)
timeout 0

# TCP keepalive
tcp-keepalive 300

# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

# Run as daemon (set to no for Docker)
daemonize no

# Supervised mode (no for Docker, systemd for systemd service)
supervised no

# PID file
pidfile /var/run/redis/redis-server.pid

# Logging level (debug, verbose, notice, warning)
loglevel notice

# Log file (empty for stdout - Docker friendly)
logfile ""

# Number of databases
databases 16

# Show Redis logo on startup
always-show-logo no

# -----------------------------------------------------------------------------
# SNAPSHOTTING (RDB Persistence)
# -----------------------------------------------------------------------------

# Save the DB on disk:
# save <seconds> <changes>
# Save after 900 sec (15 min) if at least 1 key changed
save 900 1
# Save after 300 sec (5 min) if at least 10 keys changed
save 300 10
# Save after 60 sec if at least 10000 keys changed
save 60 10000

# Stop accepting writes on RDB save error
stop-writes-on-bgsave-error yes

# Compress RDB files
rdbcompression yes

# Checksum RDB files
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Remove RDB files used by replication in instances without persistence
rdb-del-sync-files no

# Working directory for RDB/AOF files
dir /data

# -----------------------------------------------------------------------------
# REPLICATION
# -----------------------------------------------------------------------------

# Replica read-only mode
replica-read-only yes

# Replication diskless sync
repl-diskless-sync no

# Replication diskless sync delay
repl-diskless-sync-delay 5

# Ping replicas every N seconds
repl-ping-replica-period 10

# Replication timeout
repl-timeout 60

# Disable TCP_NODELAY on the replica socket
repl-disable-tcp-nodelay no

# Replica priority (0 = never promote to master)
replica-priority 100

# -----------------------------------------------------------------------------
# SECURITY
# -----------------------------------------------------------------------------

# Require password - set REDIS_PASSWORD environment variable in production
requirepass REDIS_PASSWORD_PLACEHOLDER

# Rename dangerous commands to prevent accidental or malicious use
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

# ACL log max length
acllog-max-len 128

# -----------------------------------------------------------------------------
# MEMORY MANAGEMENT
# -----------------------------------------------------------------------------

# Max memory limit (adjust based on your server)
# For Celery broker, 256MB-1GB is usually sufficient
maxmemory 512mb

# Memory policy when maxmemory is reached
# allkeys-lru: Evict any key using LRU
# volatile-lru: Evict keys with expiration using LRU
# allkeys-lfu: Evict any key using LFU
# volatile-lfu: Evict keys with expiration using LFU
# allkeys-random: Evict random keys
# volatile-random: Evict random keys with expiration
# volatile-ttl: Evict keys with shortest TTL
# noeviction: Return error (default)
maxmemory-policy allkeys-lru

# LRU/LFU sample size
maxmemory-samples 5

# Replica ignore maxmemory
replica-ignore-maxmemory yes

# Active expire effort (1 = minimal, 10 = aggressive)
active-expire-effort 1

# -----------------------------------------------------------------------------
# LAZY FREEING
# -----------------------------------------------------------------------------

# Lazy free on eviction
lazyfree-lazy-eviction yes

# Lazy free on expire
lazyfree-lazy-expire yes

# Lazy free on server delete
lazyfree-lazy-server-del yes

# Lazy free on replica full sync
replica-lazy-flush yes

# Lazy free on user delete commands
lazyfree-lazy-user-del yes

# Lazy free on user flush commands
lazyfree-lazy-user-flush yes

# -----------------------------------------------------------------------------
# THREADED I/O
# -----------------------------------------------------------------------------

# I/O threads (adjust based on CPU cores)
# io-threads 4

# I/O threads for reads
# io-threads-do-reads yes

# -----------------------------------------------------------------------------
# APPEND ONLY MODE (AOF Persistence)
# -----------------------------------------------------------------------------

# Enable AOF persistence
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy
# always: fsync after every write (slowest, safest)
# everysec: fsync every second (good balance)
# no: let OS handle (fastest, least safe)
appendfsync everysec

# Disable fsync during rewrite
no-appendfsync-on-rewrite no

# Auto rewrite AOF when it grows by this percentage
auto-aof-rewrite-percentage 100

# Minimum size before auto-rewrite
auto-aof-rewrite-min-size 64mb

# Load truncated AOF on startup
aof-load-truncated yes

# Enable RDB preamble in AOF
aof-use-rdb-preamble yes

# -----------------------------------------------------------------------------
# LUA SCRIPTING
# -----------------------------------------------------------------------------

# Max execution time for Lua scripts (ms)
lua-time-limit 5000

# -----------------------------------------------------------------------------
# CLUSTER (Disabled - single instance)
# -----------------------------------------------------------------------------

# cluster-enabled no

# -----------------------------------------------------------------------------
# SLOW LOG
# -----------------------------------------------------------------------------

# Log queries slower than this (microseconds)
slowlog-log-slower-than 10000

# Max slow log entries
slowlog-max-len 128

# -----------------------------------------------------------------------------
# LATENCY MONITOR
# -----------------------------------------------------------------------------

# Latency monitoring threshold (0 = disabled)
latency-monitor-threshold 0

# -----------------------------------------------------------------------------
# EVENT NOTIFICATION
# -----------------------------------------------------------------------------

# Keyspace event notifications
# K = Keyspace events
# E = Keyevent events
# g = Generic commands (DEL, EXPIRE, RENAME, ...)
# $ = String commands
# l = List commands
# s = Set commands
# h = Hash commands
# z = Sorted set commands
# x = Expired events
# e = Evicted events
# A = Alias for "g$lshzxe"
notify-keyspace-events "Ex"

# -----------------------------------------------------------------------------
# ADVANCED CONFIG
# -----------------------------------------------------------------------------

# Hash optimization thresholds
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List optimization thresholds
list-max-ziplist-size -2
list-compress-depth 0

# Set optimization thresholds
set-max-intset-entries 512

# Sorted set optimization thresholds
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation bytes
hll-sparse-max-bytes 3000

# Stream optimization
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
# normal: normal clients
# replica: replica clients
# pubsub: pub/sub clients
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol max bulk length
proto-max-bulk-len 512mb

# Hz (server timer frequency)
hz 10

# Dynamic hz
dynamic-hz yes

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# RDB save incremental fsync
rdb-save-incremental-fsync yes

# Jemalloc background threads
jemalloc-bg-thread yes

# -----------------------------------------------------------------------------
# CELERY-SPECIFIC OPTIMIZATIONS
# -----------------------------------------------------------------------------

# For Celery, we want:
# 1. Fast pub/sub for task distribution
# 2. Reliable persistence for task results
# 3. Automatic cleanup of old keys

# The above configuration provides:
# - AOF persistence with everysec fsync for durability
# - LRU eviction to prevent memory overflow
# - Keyspace notifications for task expiration
# - Optimized data structures for Celery's usage patterns
