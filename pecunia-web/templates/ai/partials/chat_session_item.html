<a href="{% url 'ai:chat' %}?session={{ session.id }}"
   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center {% if is_active %}active{% endif %}"
   hx-get="{% url 'ai:chat' %}?session={{ session.id }}"
   hx-target="#chat-container"
   hx-push-url="true">
    <div class="text-truncate me-2">
        <i class="bi bi-chat-dots me-2"></i>
        <span class="session-title">{{ session.title|truncatechars:30 }}</span>
    </div>
    <div class="d-flex align-items-center">
        <small class="text-muted me-2">{{ session.updated_at|timesince }}</small>
        <button type="button" class="btn btn-sm btn-link text-danger p-0"
                hx-delete="{% url 'ai:chat-delete' session.id %}"
                hx-target="closest a"
                hx-swap="outerHTML"
                hx-confirm="Delete this conversation?"
                onclick="event.preventDefault(); event.stopPropagation();">
            <i class="bi bi-trash"></i>
        </button>
    </div>
</a>
